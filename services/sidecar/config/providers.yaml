# Provider registry. api_key_ref names a keyring entry; never put a secret here.
# protocol: openai | litellm | local
# enabled: false entries stay hidden from the default provider list.

version: 1

defaults:
  chat_model: deepseek-v4-flash
  temperature: 0.3
  max_tokens: 2048
  timeout_s: 60
  fallback: [kimi, glm]

providers:
  - id: deepseek
    label: DeepSeek（默认）
    protocol: openai
    base_url: https://api.deepseek.com
    api_key_ref: llm.deepseek
    enabled: true
    models: [deepseek-v4-flash, deepseek-v4-pro]
    context_window: 1000000
    capabilities: [chat, stream, json_output, tool_calls]

  - id: qwen
    label: 通义千问（阿里云百炼）
    protocol: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_ref: llm.qwen
    enabled: true
    models: [qwen-max, qwen-plus]
    capabilities: [chat, stream, embedding, rerank]

  - id: glm
    label: 智谱 GLM
    protocol: openai
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_ref: llm.glm
    enabled: true
    models: [glm-4-plus]
    capabilities: [chat, stream, embedding]

  - id: kimi
    label: 月之暗面 Kimi
    protocol: openai
    base_url: https://api.moonshot.cn/v1
    api_key_ref: llm.kimi
    enabled: true
    models: [moonshot-v1-128k]
    capabilities: [chat, stream]

  - id: doubao
    label: 字节豆包（火山方舟）
    protocol: openai
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key_ref: llm.doubao
    enabled: true
    models: [doubao-seed-1-6]
    capabilities: [chat, stream, embedding]

  - id: ollama
    label: 本地模型（Ollama）
    protocol: local
    base_url: http://127.0.0.1:11434/v1
    api_key_ref: ""
    enabled: false
    models: []
    capabilities: [chat, stream]

  - id: anthropic
    label: Claude（需自备网络与凭据）
    protocol: litellm
    base_url: https://api.anthropic.com/v1
    api_key_ref: llm.anthropic
    enabled: false
    models: [claude-sonnet-latest]
    capabilities: [chat, stream]
    requires_note: 需要海外网络出口；建议经合规云渠道（Bedrock/Vertex）转售接入

  - id: openai
    label: OpenAI（需自备网络与凭据）
    protocol: litellm
    base_url: https://api.openai.com/v1
    api_key_ref: llm.openai
    enabled: false
    models: [gpt-5-mini]
    capabilities: [chat, stream, embedding]

routing:
  chat: { provider: deepseek, model: deepseek-v4-flash }
  summarize: { provider: deepseek, model: deepseek-v4-flash }
  embed: { provider: local, model: bge-m3 }
  rerank: { provider: local, model: bge-reranker-v2-m3 }
